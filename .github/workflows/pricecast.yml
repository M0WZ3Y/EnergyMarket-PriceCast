name: PriceCast daily
# Lives on the thesis repo's DEFAULT branch as .github/workflows/pricecast.yml:
# GitHub fires `schedule` only from the default branch. It runs the code-only
# orphan branch pricecast-live (scripts/export_live_branch.py), which it checks
# out and commits state back to; main itself is never written by a run.
# ci/pricecast.yml is the source; the copy on main must match it (Task 6).
on:
  schedule:
    # UTC, no DST. Berlin = UTC+2 (CEST) / UTC+1 (CET). Off the hour: GitHub
    # delays on-the-hour schedules most. Ex-ante runs all land before 10:00 UTC
    # (12:00 CEST); shadow runs after A69 (due 18:00 Berlin).
    - cron: "50 5 * * *"
    - cron: "50 6 * * *"
    - cron: "35 7 * * *"
    - cron: "20 8 * * *"
    - cron: "5 9 * * *"
    - cron: "50 16 * * *"
    - cron: "35 17 * * *"
    - cron: "20 18 * * *"
    - cron: "5 19 * * *"
  workflow_dispatch: {}
concurrency: { group: pricecast, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (released 2026-07-20)
        with: { ref: pricecast-live }
      - name: workflow drift check
        shell: bash
        run: |   # warn only: main's copy is what actually runs
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/pricecast.yml | diff -q --strip-trailing-cr - ci/pricecast.yml >/dev/null \n            || echo "::warning::.github/workflows/pricecast.yml on main differs from ci/pricecast.yml on pricecast-live"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (released 2026-07-20)
        with: { python-version: "3.11.9", cache: pip, cache-dependency-path: requirements-live.txt }
      - run: pip install -r requirements-live.txt -c constraints-live.txt
      - name: private bundle
        env: { BUNDLE_KEY: "${{ secrets.BUNDLE_KEY }}" }
        run: |
          python ci/bundle.py fetch
          python ci/bundle.py unseal-cache
      - name: guard tests
        run: python -m pytest -q tests -m "not network"
      - name: daily run
        env: { ENTSOE_API_TOKEN: "${{ secrets.ENTSOE_API_TOKEN }}" }
        run: python scripts/daily_run.py
        continue-on-error: true
        id: daily
      - name: health
        shell: bash
        run: |
          code=$([ "${{ steps.daily.outcome }}" = success ] && echo 0 || echo 1)
          python scripts/run_health.py --exit-code $code | tee health.txt
      - run: python ci/check_write_once.py
      - name: seal cache
        env: { BUNDLE_KEY: "${{ secrets.BUNDLE_KEY }}" }
        run: python ci/bundle.py seal-cache
      - name: commit state
        shell: bash
        run: |
          git config user.name pricecast-bot; git config user.email pricecast-bot@users.noreply.github.com
          git add -f app/forecast_site/data state/entsoe_recent.csv.enc
          git diff --cached --quiet || git commit -m "state: run $(date -u +%FT%TZ)"
          git push origin HEAD:pricecast-live
      - name: publish
        env: { SURGE_LOGIN: "${{ secrets.SURGE_LOGIN }}", SURGE_TOKEN: "${{ secrets.SURGE_TOKEN }}", DOMAIN: "${{ vars.SURGE_DOMAIN }}" }
        run: |
          if (-not $env:DOMAIN) { Write-Error "vars.SURGE_DOMAIN is not set"; exit 1 }
          npx --yes surge@0.44.4 app/forecast_site $env:DOMAIN
      - name: alert
        shell: bash
        run: "! grep -q '^ALERT: ' health.txt"   # a failed job emails the author: the cloud's toast

<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day-Ahead Guide</title>
<link rel="stylesheet" href="site.css">
<style>
.article { max-width: 760px; margin: 0 auto; }
.article h1 { font-size: 32px; line-height: 1.2; letter-spacing: -.02em; margin: 8px 0 10px; }
.article .lede { font-size: 17px; color: var(--text-secondary); margin: 0 0 22px; }
.article h2 { font-size: 21px; margin: 40px 0 10px; letter-spacing: -.01em; }
.article p, .article li { font-size: 16px; line-height: 1.7; }
html[lang="fa"] .article p, html[lang="fa"] .article li { line-height: 1.95; }
.article ul { padding-inline-start: 20px; }
.article li { margin-bottom: 8px; }
.article li b { color: var(--text-primary); }
.statstrip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 8px; }
@media (max-width: 640px) { .statstrip { grid-template-columns: repeat(2, 1fr); } .article h1 { font-size: 26px; } }
figure { margin: 18px 0 8px; }
figcaption { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }
.pair h3 { font-size: 13px; margin: 0 0 2px; } .pair .sub { margin-bottom: 4px; }
.timeline { position: relative; margin: 18px 0 6px; }
.tl-row { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.tl-row:last-child { border-bottom: 0; }
.tl-time { font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-time small { display: block; font-weight: 500; color: var(--text-muted); font-size: 12px; }
.tl-row.key .tl-time { color: var(--series-1); }
.cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 36px; }
.cta a.btn { display: inline-block; text-decoration: none; background: var(--series-1); color: #fff; font-weight: 600; padding: 10px 18px; border-radius: 10px; }
.callout { border-inline-start: 3px solid var(--series-1); background: var(--surface-2); border-radius: 0 10px 10px 0; padding: 12px 14px; margin: 16px 0; font-size: 15px; }
html[dir="rtl"] .callout { border-radius: 10px 0 0 10px; }
a { color: var(--series-1); }
nav.crumbs { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1><a href="index.html" style="color:inherit;text-decoration:none" data-t="brand">PriceCast Daily</a></h1><nav class="crumbs"><a href="index.html" data-t="toDash">Tomorrow's forecast →</a></nav></div>
    <div class="controls">
      <button id="lang" type="button">فارسی</button>
      <button id="theme" type="button" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <main class="article" id="article"><div class="card empty">Loading…</div></main>
  <footer id="foot" class="article"></footer>
</div>
<script src="charts.js"></script>

         ["۰۰:۰۰", "روز تحویل", "تحویل آغاز می‌شود و هر ساعت با قیمت حراجِ دیروز تسویه می‌شود."]],

    p_seasons: "فصل شکلِ روز را عوض می‌کند. در ژوئیه اوج خورشیدی دره‌ای در میانه روز می‌کند؛ در ژانویه این دره از بین می‌رود و اوج عصر غالب است.",
    cap_seasons: "میانگین قیمت بر حسب ساعت روز، ژانویه در برابر ژوئیه ۲۰۲۵ (یورو/مگاوات‌ساعت).", jan: "ژانویه ۲۰۲۵", jul: "ژوئیه ۲۰۲۵",

             ["ذخیره‌سازی.", "باتری از فاصله قیمت ساعت ارزان و گران درآمد دارد، پس باید بداند این فاصله کجا خواهد بود."],
             ["پیشنهاددهی و پوشش ریسک.", "تولیدکنندگان و خرده‌فروشان پیش از دانستن نتیجه حراج تصمیم می‌گیرند چه پیشنهادی بدهند."]],

let lang = "en", G = null, L = null;
try { lang = localStorage.getItem("pc-lang") || (new URLSearchParams(location.search).get("lang") === "fa" ? "fa" : "en"); } catch (e) {}
const t = (k, vars) => { let s = (T[lang][k] ?? T.en[k] ?? k); if (typeof s !== "string") return s; for (const [a, b] of Object.entries(vars || {})) s = s.replace(`{${a}}`, b); return s; };
const fmtDay = (iso, opts) => new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString(lang === "fa" ? "fa-IR-u-ca-gregory" : "en-GB", opts);
const bullets = items => `<ul>${items.map(([b, s]) => `<li><b>${esc(b)}</b> ${esc(s)}</li>`).join("")}</ul>`;

function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.getElementById("lang").textContent = lang === "fa" ? "English" : "فارسی";
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = t(n.dataset.t));
  const s = G.stats_2026, ex = G.extremes;
  const hist = (L && L.history) || [];
  let h = `<h1>${esc(t("h1"))}</h1><p class="lede">${esc(t("lede"))}</p>
    <div class="statstrip">
      <div class="tile"><div class="label">${esc(t("s_mean"))}</div><div class="v">${dec(s.mean, 1)}</div><div class="s">${esc(t("unit"))}</div></div>
      <div class="tile"><div class="label">${esc(t("s_max"))}</div><div class="v">${dec(s.max, 0)}</div><div class="s">${esc(t("unit"))}</div></div>
      <div class="tile"><div class="label">${esc(t("s_min"))}</div><div class="v">${dec(s.min, 0)}</div><div class="s">${esc(t("unit"))}</div></div>
      <div class="tile"><div class="label">${esc(t("s_neg"))}</div><div class="v">${int(s.negative_hours)}</div><div class="s">${pct(100 * s.negative_hours / s.hours)} · ${esc(fmtDay(s.through, { day: "numeric", month: "short" }))}</div></div>
    </div>
    <h2>${esc(t("h_dayahead"))}</h2><p>${esc(t("p_dayahead1"))}</p><p>${esc(t("p_dayahead2"))}</p>
    <h2>${esc(t("h_timeline"))}</h2>
    <div class="card timeline">${t("tl").map(([tm, d, txt, key]) => `<div class="tl-row${key ? " key" : ""}"><div class="tl-time">${esc(tm)}<small>${esc(d)}</small></div><div>${esc(txt)}</div></div>`).join("")}</div>
    <p>${esc(t("p_timeline"))}</p>
    <h2>${esc(t("h_visual"))}</h2><p>${esc(t("p_week"))}</p>
    <figure class="card"><div class="chart" id="g-week"></div><figcaption>${esc(t("cap_week", { a: fmtDay(G.week.start, { day: "numeric", month: "long" }), b: fmtDay(G.week.end, { day: "numeric", month: "long", year: "numeric" }) }))}</figcaption></figure>`;
  if (hist.length) h += `<p>${esc(t("p_track"))}</p><figure class="card">${legend([["", "var(--series-1)", T[lang].brand + " · " + (lang === "fa" ? "پیش‌بینی" : "forecast")], ["", "var(--series-2)", lang === "fa" ? "منتشرشده" : "published"]])}<div class="chart" id="g-track"></div><figcaption>${esc(t("cap_track"))}</figcaption></figure>`;
  h += `<h2>${esc(t("h_drivers"))}</h2><p>${esc(t("p_drivers"))}</p>
    <div class="pair">
      ${["low", "high"].map(k => `<div class="card"><h3>${esc(t(k + "day"))} · ${esc(fmtDay(ex[k].day, { day: "numeric", month: "long" }))}</h3><p class="sub">${esc(t("avg"))} ${dec(ex[k].mean_price, 1)} ${esc(t("unit"))}</p><div class="chart" id="g-${k}-p"></div><p class="sub" style="margin-top:8px">${esc(t("ws"))}</p><div class="chart" id="g-${k}-w"></div></div>`).join("")}
    </div>
    ${bullets(t("li_drivers"))}
    <p>${esc(t("p_seasons"))}</p>
    <figure class="card">${legend([["", "var(--series-1)", t("jan")], ["", "var(--series-2)", t("jul")]])}<div class="chart" id="g-season"></div><figcaption>${esc(t("cap_seasons"))}</figcaption></figure>
    <h2>${esc(t("h_why"))}</h2>${bullets(t("li_why"))}
    <h2>${esc(t("h_hard"))}</h2>
    <p>${t("p_hard1", { min: dec(s.min, 0), max: dec(s.max, 0) })}</p>
    <p>${t("p_hard2", { mean: dec(s.mean, 0) })}</p>
    <div class="callout">${esc(t("callout"))}</div>
    <h2>${esc(t("h_how"))}</h2><p>${esc(t("p_how"))}</p>
    <div class="card cta"><span>${esc(t("cta_text"))}</span><a class="btn" href="index.html">${esc(t("cta_btn"))}</a></div>`;
  document.getElementById("article").innerHTML = h;
  // Latin names isolated so RTL reordering cannot scatter their punctuation
  document.getElementById("foot").innerHTML = esc(t("foot", { src: "@@SRC@@" })).replace("ENTSO-E Transparency Platform", "<bdi>ENTSO-E Transparency Platform</bdi>").replace("@@SRC@@", `<bdi>${esc(G.source)}</bdi>`);

  const hours = [...Array(24).keys()];
  const wk = G.week;
  const dayTicks = wk.timestamps.map((ts, i) => ts.endsWith("00:00") ? i : -1).filter(i => i >= 0);
  lineChart(document.getElementById("g-week"), { x: wk.timestamps, xFmt: ts => fmtDay(ts, { weekday: "short", day: "numeric" }) + (ts.endsWith("00:00") ? "" : " " + hh(+ts.slice(11, 13))),
    series: [{ name: "EUR/MWh", values: wk.price, color: "var(--series-1)" }], height: 260, xTicks: dayTicks });
  if (hist.length) lineChart(document.getElementById("g-track"), { x: hist.map(r => r.day), xFmt: d => fmtDay(d, { day: "numeric", month: "short" }), height: 220,
    series: [{ name: lang === "fa" ? "پیش‌بینی" : "Forecast", values: hist.map(r => r.forecast_baseload), color: "var(--series-1)" },
             { name: lang === "fa" ? "منتشرشده" : "Published", values: hist.map(r => r.actual_baseload), color: "var(--series-2)" }] });
  // shared y-scales inside each small-multiple row, so the two days are comparable at a glance
  const pAll = [...ex.low.price, ...ex.high.price], wAll = [...ex.low.wind_solar, ...ex.high.wind_solar];
  for (const k of ["low", "high"]) {
    lineChart(document.getElementById(`g-${k}-p`), { x: hours, xFmt: hh, height: 150, xTicks: [0, 6, 12, 18, 23], width: 380, yDomain: [Math.min(...pAll), Math.max(...pAll)],
      series: [{ name: "EUR/MWh", values: ex[k].price, color: "var(--series-1)" }] });
    lineChart(document.getElementById(`g-${k}-w`), { x: hours, xFmt: hh, height: 120, xTicks: [0, 6, 12, 18, 23], width: 380, yDomain: [0, Math.max(...wAll)],
      yFmt: v => axisInt(v / 1000),  // GW
      series: [{ name: "MW", values: ex[k].wind_solar, color: "var(--series-1)" }] });
  }
  lineChart(document.getElementById("g-season"), { x: hours, xFmt: hh, height: 240, xTicks: [0, 3, 6, 9, 12, 15, 18, 21, 23],
    series: [{ name: t("jan"), values: G.seasons.january_2025, color: "var(--series-1)" }, { name: t("jul"), values: G.seasons.july_2025, color: "var(--series-2)" }] });
}

document.getElementById("lang").onclick = () => { lang = lang === "fa" ? "en" : "fa"; try { localStorage.setItem("pc-lang", lang); } catch (e) {} if (G) render(); };
document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("pc-theme", document.documentElement.dataset.theme); } catch (e) {}
};
try { const th = localStorage.getItem("pc-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
Promise.all([
  fetch("data/guide.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("guide.json " + r.status); return r.json(); }),
  fetch("data/latest.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([g, l]) => { G = g; L = l; render(); })
  .catch(e => { document.getElementById("article").innerHTML = `<div class="card empty">${esc(e.message)}. Run scripts/build_guide_data.py.</div>`; });
</script>
</body>
</html>

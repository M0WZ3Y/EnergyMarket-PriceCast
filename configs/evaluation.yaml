# Evaluation framework configuration — src/evaluation/
#
# Daily-recalibration walk-forward protocol, exactly as Lago et al. (2021) /
# epftoolbox implement it for LEAR: each forecast origin trains on a fixed
# trailing calibration window, predicts one day ahead, then the origin
# advances by step_days. Never a random/shuffled split.

walk_forward:
  # Trailing training window length in days, immediately preceding each
  # origin. 364*3 = epftoolbox/Lago et al.'s own LEAR default
  # (epftoolbox.models._lear.LEAR.__init__ default calibration_window).
  calibration_window_days: 1092
  # Days to advance the origin by after each forecast (1 = daily recalibration).
  step_days: 1

# Validation window: carved from the trailing days of the train split, used
# for Optuna hyperparameter tuning. Must sit strictly before the test window
# — enforced by assert_validation_before_test(), never just assumed.
validation:
  validation_days: 364

# Regime definition for the regime-aware ensemble (sanctioned 2026-07-11).
#
# Threshold family: train mean + k*std with k = 1.5, computed on price data
# up to 2015-01-04 inclusive (mean 37.6876, std 16.6742).
#
# The cutoff is strictly before BOTH windows that could contaminate it:
#   Optuna tuning window          2015-01-05 -> 2016-01-03
#   ensemble weight-fitting window 2015-01-12 -> 2016-01-03
# An earlier revision used <= 2015-01-11, which preceded the weight-fitting
# window but overlapped the tuning window by 7 days. Tightened 2026-08-04;
# the regime split is unchanged either way (validation 37/357, test 77/728),
# so this buys provenance, not a different result.
# tests/test_regime_threshold.py asserts this value against the raw data —
# the property is checked, not merely asserted in a comment.
#
# k is chosen by a VALIDATION-ONLY rule (decision 2026-08-04): take the
# largest k in {3.0, 2.5, 2.0, 1.5} for which BOTH regimes hold at least
# MIN_DAYS_PER_REGIME (20) days in the validation window. k=2.0 yields 10
# stressed days, k=1.5 yields 37. The test window is never consulted —
# picking a threshold by how it behaves on test would be in-sample selection.
#
# This supersedes the week-2 EDA's 3*std = 84.04 value FOR REGIME SWITCHING
# only: at 3*std the validation window holds just 3 stressed days, too few to
# fit a weight set on (see logs/decisions.md 2026-08-04). The 84.04 figure
# remains valid as a descriptive statistic; it is only rejected as a switch.
#
# A day is labeled 'stressed' when the PREVIOUS day's realized prices breached
# the threshold (regime_labels() enforces the previous-day-only rule). At
# ~1.5 sigma this marks an ELEVATED day, not a price spike — hence 'stressed'.
regime:
  stress_threshold_eur_mwh: 62.6989

optuna:
  n_trials: 50

random_seed: 42
